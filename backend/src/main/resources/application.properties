spring.application.name=thuctapmoi

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DocumentManagerDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}

spring.output.ansi.enabled=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}
# Dung lượng tối đa của một file
spring.servlet.multipart.max-file-size=10MB

# Dung lượng tối đa của toàn bộ request upload
spring.servlet.multipart.max-request-size=12MB

# Thư mục lưu file thật
app.storage.upload-dir=uploads
# Thư mục chứa chương trình tesseract.exe
ocr.tesseract-path=C:/Users/LENOVO/Downloads/java2

# Thư mục chứa dữ liệu nhận diện ngôn ngữ
ocr.tessdata-path=C:/Users/LENOVO/Downloads/java2/tessdata

# Nhận diện cả tiếng Việt và tiếng Anh
ocr.language=vie+eng

server.error.include-message=always